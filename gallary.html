     <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        

        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #ffffff;
            font-size: 28px;
        }

        .gallery {
           display: flex;
            gap: 70px;
            flex-wrap: wrap;
        }

        .card {
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.25);
            transition: transform 0.3s, box-shadow 0.3s;
            flex-wrap: wrap;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.3);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
             border-radius: 12px;
        }

        .card-body {
            padding: 10px;
        }

        .card-body h3 {
            font-size: 20px;
            color: #0b464b;
            margin-bottom: 10px;
        }

        .card-body p {
            font-size: 14px;
            color: #555;
            margin-bottom: 12px;
        }

       @media (max-width: 768px) {

    .gallery {
        gap: 20px;
        padding: 20px;
    }

    .card {
        width: 100%;
        max-width: 200px;
        
    }

    .card img {
        height: 120px;
    }

    .card-body h3 {
        font-size: 18px;
    }
}

/* ===== SMALL MOBILE ===== */
@media (max-width: 480px) {

    .gallery {
        gap: 16px;
    }

    .card {
        max-width: 100%;
    }

    .card img {
        height: 120px;
    }
}
    </style>
  
    
</head>
