<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel - Add Service</title>
    <style>

 * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
}

body {
    min-height: 100vh;
    background:rgb(11, 70, 75);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Form Card */
form {
    width: 420px;
    background: #ffffff;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
}

/* TOP HEADER */
.form-header {
    background: linear-gradient(to right, #31c2cc, #38ef7d);
    padding: 22px;
    text-align: center;
}

.form-header h2 {
    color: #fff;
    font-size: 22px;
    font-weight: 600;
}

.form-header p {
    color: #eaffea;
    font-size: 13px;
    margin-top: 4px;
}

/* Form body */
form input,
form textarea {
    width: 90%;
    display: block;
    margin: 15px auto;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid #d3d2d2;
    font-size: 15px;
}

textarea {
    resize: none;
    height: 100px;
}

input:focus,
textarea:focus {
    outline: none;
    border-color: #000000;
    box-shadow: 0 0 0 2px rgba(15, 155, 15, 0.2);
}

/* Button */
button {
    width: 90%;
    margin: 20px auto 25px;
    display: block;
    padding: 14px;
    background: linear-gradient(to right, #48dad2, #3be9e0);
    border: none;
    border-radius: 30px;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}

/* Mobile */
@media (max-width: 500px) {
    form {
        width: 90%;
    }
}


    </style>
</head>
<body>


<form id="serviceForm">

    <div class="form-header">
        <h2>Add New projects</h2>
        <p>Solar Admin Panel</p>
    </div>

    <input type="text" id="title" placeholder="Project Title" required>
    <input type="text" id="image" placeholder="Image Path " required>
    <textarea id="description" placeholder="Project Description" required></textarea>

<input type="text" id="image1" placeholder="Image 1 path" required>
<input type="text" id="image2" placeholder="Image 2 path" required>
<input type="text" id="image3" placeholder="Image 3 path" required>
<input type="text" id="link" placeholder="Page Link (gallary.html)" required>

    <button type="submit">Add Service</button>
    
</form>
<script src="admin.js"></script>
</body>
</html>
